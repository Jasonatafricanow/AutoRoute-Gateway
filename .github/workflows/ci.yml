name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Start with runtime-error checks; broad style cleanup is a separate change.
      - run: python -m ruff check --config pyproject.toml --select E9,F63,F7,F82 .
      - run: python -m pytest -q
